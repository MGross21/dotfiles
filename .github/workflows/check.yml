name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config   = true
            narinfo-cache-negative-ttl = 0
            extra-substituters    = https://nix-community.cachix.org https://hyprland.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Must precede the flake check: realises the openclaw IFD path that
      # `--no-build` cannot fetch itself.
      - name: Hosts
        run: |
          for host in msi dell; do
            echo "::group::$host"
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
            nix build --dry-run ".#nixosConfigurations.$host.config.system.build.toplevel"
            echo "::endgroup::"
          done

      - name: Flake check
        run: nix flake check --no-build -L

      - name: Formatting
        run: nix fmt -- --check
