name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config   = true
            abort-on-warn         = true
            narinfo-cache-negative-ttl = 0
            extra-substituters    = https://nix-community.cachix.org https://hyprland.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Must precede the flake check: realises the openclaw IFD path that
      # `--no-build` cannot fetch itself.
      - name: Configurations
        run: |
          for attr in $(.github/targets.sh ${{ matrix.system }}); do
            echo "::group::$attr"
            nix eval --raw ".#$attr.drvPath"
            echo
            nix build --dry-run ".#$attr"
            echo "::endgroup::"
          done

      - name: Flake check
        if: matrix.system == 'x86_64-linux'
        run: nix flake check --no-build --all-systems -L

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Formatting
        run: nix fmt -- --ci

      - name: statix
        run: nix run nixpkgs#statix -- check .

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail --exclude hosts/*/hardware-configuration.nix -- .

      - name: shellcheck
        run: nix run nixpkgs#shellcheck -- scripts/*.sh .github/*.sh

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [eval, lint]
    runs-on: ubuntu-latest
    concurrency:
      group: promote
      cancel-in-progress: true

    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      # GITHUB_TOKEN cannot move a ref across workflow-file changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config   = true
            narinfo-cache-negative-ttl = 0
            extra-substituters    = https://nix-community.cachix.org https://hyprland.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build servers
        run: |
          for host in $(.github/servers.sh); do
            echo "::group::$host"
            nix build -L --no-link ".#nixosConfigurations.$host.config.system.build.toplevel"
            echo "::endgroup::"
          done

      - name: Promote to deploy
        run: git push origin "$GITHUB_SHA:refs/heads/deploy"
