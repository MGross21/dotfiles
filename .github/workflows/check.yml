name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config   = true
            max-jobs              = 2
            cores                 = 2
            narinfo-cache-negative-ttl = 0
            extra-substituters    = https://nix-community.cachix.org https://hyprland.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Evaluates every nixosConfiguration (msi, dell, installer) and every
      # package output. This is what catches an eval break on a host this
      # machine never builds.
      - name: Flake check
        run: nix flake check --no-build -L

      # The formatter resolves its own file list from git, so this covers every
      # .nix file the repo owns and nothing it merely contains.
      - name: Formatting
        run: nix fmt -- --check

      # Resolves each host's full closure without downloading it, so a
      # reference to a package that no longer exists in nixpkgs fails here
      # rather than on a rebuild.
      - name: Resolve host closures
        run: |
          for host in msi dell; do
            echo "::group::$host"
            nix build --dry-run ".#nixosConfigurations.$host.config.system.build.toplevel"
            echo "::endgroup::"
          done
