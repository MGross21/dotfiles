name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  eval:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            abort-on-warn = true
            narinfo-cache-negative-ttl = 0

      # Must precede the flake check: realises the openclaw IFD path that
      # `--no-build` cannot fetch itself.
      - name: Configurations
        run: nix build --dry-run .#legacyPackages.${{ matrix.system }}.configurations

      - name: Flake check
        if: matrix.system == 'x86_64-linux'
        run: nix flake check --no-build --all-systems -L

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            system-features = nixos-test benchmark big-parallel kvm

      # treefmt (format + lint) and the VM tests.
      - name: Checks
        run: nix run --inputs-from . nixpkgs#nix-fast-build -- --flake .#checks.x86_64-linux --no-nom --no-link

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [eval, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: promote
      cancel-in-progress: false

    steps:
      - name: Free disk space
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache >/dev/null 2>&1 &

      # GITHUB_TOKEN cannot move a ref across workflow-file changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            narinfo-cache-negative-ttl = 0

      - uses: cachix/cachix-action@v17
        with:
          name: mgross-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build auto-upgraded hosts
        run: nix run --inputs-from . nixpkgs#nix-fast-build -- --flake .#legacyPackages.x86_64-linux.autoUpgrade --no-nom --out-link result

      # NVIDIA and CUDA licenses forbid re-hosting on a public cache.
      - name: Push to cachix
        run: nix run .#cachix-push -- mgross-nix ./result-*

      - name: Promote to deploy
        run: git push --force origin "$GITHUB_SHA:refs/heads/deploy"
