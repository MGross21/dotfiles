name: Build Installer ISO

on:
  push:
    branches: [main]
    # Everything the installer closure evaluates; see mkInstaller in parts/hosts.nix.
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'parts/hosts.nix'
      - 'parts/packages.nix'
      - 'hosts/installer/**'
      - 'modules/system/nix.nix'
      - 'modules/shared/user.nix'
      - 'modules/shared/hosts.nix'
      - '.github/workflows/iso.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            narinfo-cache-negative-ttl = 0

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build ISO
        run: nix build .#packages.${{ matrix.system }}.installer --out-link result -L --keep-going

      - name: Compress ISO
        run: |
          ISO=$(ls result/iso/*.iso)
          zstd -19 -T0 --no-progress "$ISO" -o "installer-${{ matrix.system }}.iso.zst"
          echo "Original:   $(du -sh "$ISO" | cut -f1)"
          echo "Compressed: $(du -sh "installer-${{ matrix.system }}.iso.zst" | cut -f1)"

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.system }}
          path: installer-${{ matrix.system }}.iso.zst
          compression-level: 0

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete installer-latest --yes 2>/dev/null || true
          gh api repos/${{ github.repository }}/git/refs/tags/installer-latest -X DELETE 2>/dev/null || true
          cat > notes.md <<'EOF'
          Built from ${{ github.sha }}.
          Root SSH by key (`user.sshKeys`) for nixos-anywhere; `disko-install` for local installs; nmtui for wifi.

          Flash: `zstd -dc installer-<system>.iso.zst | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync`
          EOF
          gh release create installer-latest installer-*.iso.zst \
            --target ${{ github.sha }} \
            --title "Installer ISO (latest)" \
            --latest \
            --notes-file notes.md
